[project]
name = "alert-agent-runtime"
version = "0.1.0"
description = "Alert cognitive runtime: FastAPI gateway + diagnosis agent + RAG agent (src/alert_agent five-layer package)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "grpcio==1.62.3",
    "grpcio-tools==1.62.3",
    "protobuf>=4.25.3,<5",
    "psycopg[binary,pool]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "langgraph==1.2.24",
    "rank-bm25==0.2.2",
    "jieba==0.42.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "src/alert_agent/infrastructure/grpc/gen",
    ".venv",
]