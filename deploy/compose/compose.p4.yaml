services:
  postgres:
    # pgvector image: cognitive migrations require the vector extension (D7).
    # Pulled through the DaoCloud Docker Hub mirror for CN network reliability;
    # the alert-pg-data volume is preserved across the image swap.
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: alert-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: alert
      POSTGRES_PASSWORD: alert
      POSTGRES_DB: alert
      TZ: UTC
      PGTZ: UTC
      PGPASSWORD: alert
    volumes:
      - alert-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert -d alert"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: alert-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 双 listener：容器内走 kafka:29092，宿主机走 127.0.0.1:9092。
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - alert-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    # 一次性创建 4 个按域 topic；--if-not-exists 保证幂等。
    image: apache/kafka:3.8.0
    container_name: alert-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-init.sh:/opt/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/opt/kafka-init.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPICS: "alertflow.registry.events.v1 alertflow.monitor.events.v1 alertflow.episode.events.v1 alertflow.task.events.v1"
    restart: "no"

  provision:
    # 一次性创建 4 schema / 4 role；profile=setup，可重复执行。
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: alert-provision
    profiles: ["setup"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../split/provision.sh:/opt/provision.sh:ro
    entrypoint: ["/bin/bash", "/opt/provision.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: alert
      PGPASSWORD: alert
      PGDATABASE: alert
      ALERT_REGISTRY_PASSWORD: ${ALERT_REGISTRY_PASSWORD:-alert_registry_pw_dev}
      ALERT_MONITOR_PASSWORD: ${ALERT_MONITOR_PASSWORD:-alert_monitor_pw_dev}
      ALERT_EPISODE_PASSWORD: ${ALERT_EPISODE_PASSWORD:-alert_episode_pw_dev}
      ALERT_TASK_PASSWORD: ${ALERT_TASK_PASSWORD:-alert_task_pw_dev}
    restart: "no"

  episode-svc:
    build:
      context: ../../go
      dockerfile: services/episode-svc/Dockerfile
    container_name: alert-episode-svc
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVICE_NAME: episode-svc
      HTTP_ADDR: ":8082"
      DATABASE_URL: "postgres://alert_episode:alert_episode_pw_dev@postgres:5432/alert?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_PUBLISH_TOPIC: "alertflow.episode.events.v1"
      KAFKA_CONSUME_TOPICS: "alertflow.monitor.events.v1"
      REGISTRY_BASE_URL: "http://host.docker.internal:8081"
      MONITOR_BASE_URL: "http://host.docker.internal:8083"
      TASK_BASE_URL: "http://host.docker.internal:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/episode-svc", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  console-bff:
    # P4：episode 路由（11/12/13）直连 episode-svc；dashboard/timeline 暂留 legacy 单体。
    build:
      context: ../../go
      dockerfile: services/console-bff/Dockerfile
    container_name: alert-console-bff
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVICE_NAME: console-bff
      HTTP_ADDR: ":8080"
      REGISTRY_BASE_URL: "http://host.docker.internal:8081"
      MONITOR_BASE_URL: "http://host.docker.internal:8083"
      EPISODE_BASE_URL: "http://episode-svc:8082"
      TASK_BASE_URL: "http://host.docker.internal:8084"
      LEGACY_BASE_URL: "http://host.docker.internal:8084"
    healthcheck:
      test: ["CMD", "/app/console-bff", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  alert-pg-data:
  alert-kafka-data: